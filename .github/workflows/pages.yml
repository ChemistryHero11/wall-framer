name: Deploy to GitHub Pages

# Optional free hosting in addition to Vercel. Manual (opt-in) so it doesn't fail before setup.
# One-time setup: repo Settings -> Pages -> Build and deployment -> Source: "GitHub Actions",
# then run this from the Actions tab -> "Deploy to GitHub Pages" -> "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
